apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - name: service-b
          image: kartikchopra254/service-b:latest
          ports:
            - containerPort: 4000
         
---

apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  selector:
    app: service-b 
  type: ClusterIP  # yaml is super sensitive it took hours to find that there was an identation error here and type was specified under the selector so it was working as selector label not as type =clusterIP
  ports:
    - port: 80
      targetPort: 4000



