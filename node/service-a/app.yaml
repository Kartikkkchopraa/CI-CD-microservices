apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: kartikchopra254/service-a:latest
          ports:
            - containerPort: 3000
          env:
            - name: TAX_SERVICE_URL
              value: http://service-b
---

apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
     
